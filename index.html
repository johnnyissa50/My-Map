<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<!-- Colors the browser UI strip above/below the page (status bar / bottom bar)
     instead of leaving it default white/red — now a neutral gray. -->
<meta name="theme-color" content="#4a4a4a">
<!-- If the page is ever added to the Home Screen, these make it launch as a
     standalone app with a translucent status bar, so the page's own gray
     background shows through behind the notch instead of the OS drawing a
     plain bar there. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FAT Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<!-- MarkerCluster.Default.css intentionally omitted: iconCreateFunction below
     fully replaces the default cluster icon, so its styles are never used. -->
<!-- Warm up DNS + TLS to the tile servers before the first actual tile
     request is made, so the first frames of the basemap load faster. -->
<link rel="preconnect" href="https://mt0.google.com">
<link rel="preconnect" href="https://server.arcgisonline.com">
<link rel="preconnect" href="https://tile.openstreetmap.org">
<style>
  html, body {
    margin:0; padding:0; font-family: 'Segoe UI', Tahoma, sans-serif;
    background:#4a4a4a; /* shows behind the red header in the safe-area strip (notch) */
    height:100%;    /* fallback for browsers without dvh support */
    height:100dvh;  /* tracks Safari's real visible viewport as its toolbar shows/hides */
  }
  /* Map starts right below the header row; the header itself is pushed down
     by the top safe-area inset (see #topbar), so this stays in sync with it
     instead of hardcoding an extra offset here. */
  #map { position:absolute; top:calc(64px + env(safe-area-inset-top, 0px)); bottom:0; left:0; right:0; }
  /* Prevent iOS's native long-press image callout / blue selection
     highlight from appearing during the double-tap-hold-drag zoom
     gesture (it treats the map tiles as regular <img> elements). */
  #map, #map * {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* Popups are the exception: allow selecting/copying the FAT code with
     mouse drag / double-click on desktop and long-press on mobile. The
     higher specificity (#map + class) beats the rule above. */
  #map .leaflet-popup-content,
  #map .leaflet-popup-content * {
    -webkit-touch-callout: default;
    -webkit-user-select: text;
    user-select: text;
    cursor: text;
  }
  #map .leaflet-popup-content a { cursor: pointer; }
  #topbar {
    /* Sits right below the safe-area strip so the same gray extends
       continuously from the notch through the header — height stays a
       plain fixed 64px like before. */
    position:absolute; top:env(safe-area-inset-top, 0px); left:0; right:0;
    height:64px; z-index:1000;
    background:#4a4a4a; color:#fff; display:flex; align-items:center; gap:10px;
    padding:0 12px; box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  #topbar h1 { font-size:15px; margin:0; white-space:nowrap; font-weight:600;}
  #searchBox { flex:1; position:relative; }
  #searchInput {
    width:100%; box-sizing:border-box; padding:10px 12px; border-radius:8px; border:none;
    font-size:15px; outline:none;
  }
  #searchInput::placeholder { color:#999; }
  #suggestions {
    position:absolute; top:44px; left:0; right:0; background:#fff; border-radius:8px;
    max-height:140px; overflow-y:auto; box-shadow:0 4px 14px rgba(0,0,0,.3); display:none; z-index:1001;
  }
  #suggestions div { padding:10px 12px; color:#222; cursor:pointer; border-bottom:1px solid #eee; font-size:14px; }
  #suggestions div:hover { background:#f2f2f2; }
  .leaflet-popup-content { font-size:14px; }

  #layerBtn { flex:none; }
  #layerWrap { position:relative; flex:none; }

  #locateBtn, #layerBtn {
    width:40px; height:40px; flex:none; border-radius:8px; border:none;
    background:#fff; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 4px rgba(0,0,0,.2);
  }
  #locateBtn svg, #layerBtn svg { width:22px; height:22px; fill:#1a73e8; }
  #locateBtn:active, #layerBtn:active { background:#eee; }
  #locateBtn.active { background:#1a73e8; }
  #locateBtn.active svg { fill:#fff; }

  #layerMenu {
    position:absolute; top:48px; right:0; background:#fff; border-radius:8px;
    box-shadow:0 4px 14px rgba(0,0,0,.3); display:none; z-index:1001; overflow:hidden; min-width:180px;
  }
  #layerMenu.open { display:block; }
  #layerMenu div { padding:10px 14px; color:#222; cursor:pointer; font-size:14px; }
  #layerMenu div:hover { background:#f2f2f2; }
  #layerMenu div.selected { font-weight:700; color:#1a73e8; }

  .user-dot {
    width:16px; height:16px; border-radius:50%; background:#000;
    border:3px solid #fff; box-shadow:0 0 0 2px rgba(0,0,0,.4);
  }
  .cluster-dot {
    width:24px; height:24px; border-radius:50%; background:#808080;
    border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4);
  }
  .point-dot {
    width:14px; height:14px; border-radius:50%; background:#2A81CB;
    border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  /* Invisible padding around the visible dot: the marker's clickable box
     (set via iconSize/pointIconAnchor below) is bigger than the dot itself,
     and this centers the dot inside it without changing how it looks. */
  .point-hit-area {
    width:27px; height:27px; display:flex; align-items:center; justify-content:center;
  }

  /* Permanent name labels (only created in JS from zoom 18+) */
  .point-label {
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0 0 0 4px;
    margin: 0;
    font-size: 11px;
    font-weight: 700;
    color: #000;
    /* Solid (non-blurred) white outline: 8 hard-edged shadows around the
       text, so it stays readable over any satellite imagery. */
    text-shadow:
      -1.5px -1.5px 0 #fff, 0 -1.5px 0 #fff, 1.5px -1.5px 0 #fff,
      -1.5px  0     0 #fff,                   1.5px  0     0 #fff,
      -1.5px  1.5px 0 #fff, 0  1.5px 0 #fff, 1.5px  1.5px 0 #fff;
    white-space: nowrap;
  }
  .point-label::before { display: none; } /* remove tooltip arrow */

  #visitCounter {
    position:absolute; bottom:calc(8px + env(safe-area-inset-bottom, 0px)); left:8px; z-index:900;
    opacity:0.85; pointer-events:none;
  }
  #visitCounter img { display:block; height:20px; }
  /* Measure-distance tool: sits under the +/- zoom buttons (top-right). */
  .leaflet-bar.measure-control a {
    display:flex; align-items:center; justify-content:center; color:#222;
  }
  .leaflet-bar.measure-control a.active,
  .leaflet-bar.measure-control a.active:hover { background:#1a73e8; color:#fff; }
  /* Live total, shown to the left of the button while measuring */
  .measure-readout {
    position:absolute; right:calc(100% + 8px); top:50%; transform:translateY(-50%);
    display:none; background:#fff; color:#000; font-weight:700; font-size:14px;
    padding:5px 10px; border-radius:6px; box-shadow:0 1px 5px rgba(0,0,0,.4);
    white-space:nowrap; pointer-events:none;
  }
  #map.measuring, #map.measuring .leaflet-grab, #map.measuring .leaflet-interactive { cursor:crosshair; }
  /* While measuring, FAT points must not swallow the tap (they would open a
     popup and stop it before it reaches the map). Making them click-through
     sends the tap to the map exactly like a tap on empty ground.
     Cluster circles are left alone so they still zoom in. */
  #map.measuring .fat-icon,
  #map.measuring .fat-icon *,
  #map.measuring .user-icon,
  #map.measuring .user-icon *,
  #map.measuring .coord-icon,
  #map.measuring .coord-icon * { pointer-events:none !important; }
  #map.measuring .leaflet-overlay-pane canvas { pointer-events:none !important; }
</style>
</head>
<body>

<div id="topbar">
  <div id="searchBox">
    <input id="searchInput" type="text" placeholder="722-R01-FDT01-FAT01" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" />
    <div id="suggestions"></div>
  </div>
  <div id="layerWrap">
    <button id="layerBtn" title="Change map background">
      <svg viewBox="0 0 24 24"><path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"/></svg>
    </button>
    <div id="layerMenu">
      <div data-layer="google" class="selected">Google Satellite</div>
      <div data-layer="esri">Esri Satellite</div>
      <div data-layer="street">Street (OpenStreetMap)</div>
    </div>
  </div>
  <button id="locateBtn" title="Find my location">
    <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 3h-2.06A7.002 7.002 0 0 0 13 4.06V2h-2v2.06A7.002 7.002 0 0 0 4.06 11H2v2h2.06A7.002 7.002 0 0 0 11 19.94V22h2v-2.06A7.002 7.002 0 0 0 19.94 13H22v-2zm-9 7c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
  </button>
</div>
<div id="map"></div>
<div id="visitCounter">
  <img src="https://visitor-badge.laobi.icu/badge?page_id=masiraq.fat-map.github.io&left_color=gray&right_color=blue" alt="visits" />
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://unpkg.com/leaflet-doubletapdrag@0.1.2"></script>
<script src="https://unpkg.com/leaflet-doubletapdragzoom@0.3.2"></script>
<script>
const map = L.map('map', {
  zoomControl: false,
  attributionControl: false, // removes the "Leaflet | Imagery © Google" bar
  doubleClickZoom: true, // double-tap / double-click to zoom in (like Google Maps)
  zoomSnap: 0.25,   // allow smooth fractional zoom levels (needed for the drag-to-zoom gesture below)
  zoomDelta: 1,
  // Double-tap, HOLD, then drag up/down to zoom — same gesture and same
  // smooth engine Leaflet's own two-finger pinch-zoom uses internally
  // (leaflet-doubletapdragzoom plugin), so it feels identical to pinch.
  doubleTapDragZoom: 'center',
  doubleTapDragZoomOptions: { reverse: true }, // drag down = zoom in, drag up = zoom out
  // Markers no longer slide/scale along with the zoom animation.
  // Instead they simply disappear during the zoom and reappear,
  // already re-clustered, once the zoom finishes — this removes the
  // brief flash of unclustered markers at the new zoom level.
  markerZoomAnimation: false
}).setView([36.85, 42.97], 10);
L.control.zoom({ position: 'topright' }).addTo(map);

// ---- Measure-distance tool ------------------------------------------------
// Button under the +/- controls. Tap it to start measuring: every tap on the
// map adds a point to a path and the running total (in meters) is shown next
// to the button. Tap the button again to erase the path and leave the mode.
// Nothing is created until measuring starts, and only the last segment is
// added on each tap (the total is accumulated, never recomputed), so it costs
// nothing while idle and stays cheap on long paths.
const MEASURE_ICON =
  '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" ' +
  'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M3 17 17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg>';

let measuring = false;
let measureTotal = 0;
let measureLast = null;
let measureLayer = null;   // holds the path + point dots so they clear in one call
let measureCasing = null;  // dark outline under the path (readable on any imagery)
let measureLine = null;
let lastMeasureEvent = null;
let measureBtn = null;
let measureOut = null;

const MeasureControl = L.Control.extend({
  options: { position: 'topright' },
  onAdd: function () {
    const wrap = L.DomUtil.create('div', 'measure-wrap');
    const bar = L.DomUtil.create('div', 'leaflet-bar measure-control', wrap);
    measureBtn = L.DomUtil.create('a', '', bar);
    measureBtn.href = '#';
    measureBtn.title = 'Measure distance';
    measureBtn.setAttribute('role', 'button');
    measureBtn.setAttribute('aria-label', 'Measure distance');
    measureBtn.innerHTML = MEASURE_ICON;
    measureOut = L.DomUtil.create('div', 'measure-readout', wrap);
    // Presses on the control must not reach the map (or they'd add a point).
    L.DomEvent.disableClickPropagation(wrap);
    L.DomEvent.on(measureBtn, 'click', function (e) {
      L.DomEvent.preventDefault(e);
      toggleMeasure();
    });
    return wrap;
  }
});
new MeasureControl().addTo(map);

function formatMeters(m) {
  return Math.round(m).toLocaleString('en-US') + ' m';
}

function startMeasure() {
  measuring = true;
  measureTotal = 0;
  measureLast = null;
  const svg = L.svg({ padding: 0.5 }); // separate from the canvas point layer
  measureCasing = L.polyline([], { renderer: svg, interactive: false, color: '#000', weight: 6, opacity: 0.55 });
  measureLine = L.polyline([], { renderer: svg, interactive: false, color: '#FFD400', weight: 3 });
  measureLayer = L.layerGroup([measureCasing, measureLine]).addTo(map);
  measureBtn.classList.add('active');
  measureOut.textContent = formatMeters(0);
  measureOut.style.display = 'block';
  map.getContainer().classList.add('measuring');
  // A double-tap (or double-tap-and-drag) would otherwise drop stray points
  // while zooming, so those gestures are paused during measuring.
  // Pinch, the +/- buttons and normal dragging all keep working.
  map.doubleClickZoom.disable();
  if (map.doubleTapDragZoom) map.doubleTapDragZoom.disable();
}

function stopMeasure() {
  measuring = false;
  if (measureLayer) { measureLayer.clearLayers(); measureLayer.remove(); }
  measureLayer = measureCasing = measureLine = measureLast = null;
  measureTotal = 0;
  measureBtn.classList.remove('active');
  measureOut.style.display = 'none';
  map.getContainer().classList.remove('measuring');
  map.doubleClickZoom.enable();
  if (map.doubleTapDragZoom) map.doubleTapDragZoom.enable();
}

function toggleMeasure() {
  if (measuring) stopMeasure(); else startMeasure();
}

// If the tap lands within ~14px of a FAT point (zoom 10+, where the visible
// points are in denseMarkers), use that FAT's exact position.
function snapToFat(latlng) {
  if (typeof denseMarkers === 'undefined' || !denseMarkers.size) return latlng;
  const p = map.latLngToContainerPoint(latlng);
  let best = null, bestD = 14;
  denseMarkers.forEach(function (m) {
    const d = p.distanceTo(map.latLngToContainerPoint(m.getLatLng()));
    if (d < bestD) { bestD = d; best = m.getLatLng(); }
  });
  return best || latlng;
}

function addMeasurePoint(e) {
  if (!measuring) return;
  // The same native click can reach us more than once (via the FAT point
  // and via the map) - count it once.
  if (e.originalEvent) {
    if (e.originalEvent === lastMeasureEvent) return;
    lastMeasureEvent = e.originalEvent;
  }

  const ll = snapToFat(e.latlng);
  if (measureLast) measureTotal += map.distance(measureLast, ll);
  measureLast = ll;
  measureCasing.addLatLng(ll);
  measureLine.addLatLng(ll);
  measureLayer.addLayer(L.circleMarker(ll, {
    renderer: measureLine.options.renderer, interactive: false,
    radius: 4, color: '#000', weight: 2, fillColor: '#FFD400', fillOpacity: 1
  }));
  measureOut.textContent = formatMeters(measureTotal);
}

map.on('click', addMeasurePoint);


// Tapping a FAT point while measuring should only add a path point, not pop
// up its info box over the path. (Popups opened by search have no source
// layer, so those still open normally.)
map.on('popupopen', function (e) {
  if (measuring && e.popup._source) e.popup.close();
});
const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
});

const esriLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  attribution: 'Tiles &copy; Esri, Maxar, Earthstar Geographics'
});

const googleLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
  maxZoom: 20,
  subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
  attribution: 'Imagery &copy; Google'
}).addTo(map); // default layer

// All clusters look identical (plain dot, no count), so build the icon
// once and hand back the same instance every time instead of allocating a
// new L.divIcon per cluster on every render/pan.
const clusterIcon = L.divIcon({
  html: '<div class="cluster-dot"></div>',
  className: '',
  iconSize: [24, 24]
});

const clusterGroup = L.markerClusterGroup({
  chunkedLoading: true,
  maxClusterRadius: 60,
  spiderfyOnMaxZoom: true,
  animate: false,
  animateAddingMarkers: false,
  iconCreateFunction: function () {
    return clusterIcon;
  }
});

// Canvas renderer for the "dense" high-zoom view. Only points currently
// inside the visible map area (plus a small buffer) are ever registered
// with it. When the view is only panned (zoom unchanged) we ADD/REMOVE
// just the points that entered/left the view, instead of tearing down
// and rebuilding everything — full rebuilds are reserved for actual zoom
// changes, since those are infrequent and also change whether labels
// (permanent tooltips) should exist at all.
// tolerance: expands the clickable/tappable area around every circleMarker
// drawn on this canvas by ~10px, without changing how big the dot looks -
// makes tapping small points on mobile far more forgiving.
const canvasRenderer = L.canvas({ padding: 0.5, tolerance: 5 });
const denseLayer = L.layerGroup();
const denseMarkers = new Map(); // point name -> currently-rendered L.circleMarker
const DENSE_ZOOM = 10; // clustering stops / canvas layer takes over from this zoom
const LABEL_ZOOM = 18; // permanent name labels appear from this zoom

let allPoints = [];
let pointByName = {};

// Partner -> dot color. Anything not listed here (missing, "#N/A", or spelled
// differently) falls back to gray. Exact match after trimming whitespace.
// A Map is used (not a plain object) so odd values like "constructor" can't
// accidentally hit an inherited property.
const DEFAULT_POINT_COLOR = '#808080';
const PARTNER_COLORS = new Map([
  ['Fiber Speed (Duhok)', '#FF0000'],
  ['Waarpak',             '#0080FF'],
  ['3BG',                 '#00B400'],
  ['Delta (Zakho)',       '#FF8000'],
  ['Delta (Duhok)',       '#FF8000'],
  ['Strong Link Duhok',   '#FF6699'],
  ['PrimeLink Duhok',     '#48B6E8'],
  ['BigLine',             '#00B400']
]);

// Same look as the close-zoom circle markers (makeCircleMarker), but as a
// divIcon so it can be used on an L.marker (needed for markercluster).
// Only a handful of distinct colors exist, so each icon object is built once
// and shared by every marker of that color - no per-marker icon allocation.
const pointIconCache = new Map();
function getPointIcon(color) {
  let icon = pointIconCache.get(color);
  if (!icon) {
    icon = L.divIcon({
      className: 'fat-icon',
      html: '<div class="point-hit-area"><div class="point-dot" style="background:' + color + '"></div></div>',
      iconSize: [27, 27]
    });
    pointIconCache.set(color, icon);
  }
  return icon;
}

function popupContent(p) {
  return '<b>' + p.n + '</b> &nbsp;<a href="#" class="copy-fat">Copy</a><br>' +
    'Partner : ' + p.pt + '<br>' +
    'Installed ONTs : ' + p.ont + '<br>' +
    '<a href="https://www.google.com/maps?q=' + p.lat + ',' + p.lng + '" target="_blank">Open in Google Maps</a>';
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  // Fallback for older browsers / non-HTTPS contexts
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy') ? resolve() : reject(); }
    catch (e) { reject(e); }
    document.body.removeChild(ta);
  });
}

// Leaflet stops click propagation at the popup container, so a document-level
// listener wouldn't see the click. Attach directly when each popup opens.
map.on('popupopen', (e) => {
  const el = e.popup.getElement();
  if (!el) return;
  const link = el.querySelector('.copy-fat');
  if (!link) return;
  link.addEventListener('click', (ev) => {
    ev.preventDefault();
    const code = el.querySelector('.leaflet-popup-content b').textContent;
    copyText(code).then(
      () => { link.textContent = 'Copied \u2713'; },
      () => { link.textContent = 'Copy failed'; }
    ).then(() => {
      setTimeout(() => { link.textContent = 'Copy'; }, 1500);
    });
  });
});

function makeCircleMarker(p, withLabel) {
  const c = L.circleMarker([p.lat, p.lng], {
    renderer: canvasRenderer,
    radius: 7,
    weight: 2,
    color: '#ffffff',
    fillColor: p.c,
    fillOpacity: 1
  });
  c.bindPopup(popupContent(p));
  if (withLabel) {
    c.bindTooltip(p.n, {
      permanent: true,
      direction: 'right',
      offset: [8, 0],
      className: 'point-label',
      interactive: false
    });
  }
  return c;
}

// Incremental: only adds points newly entering the view / removes points
// that left it. Safe to call often (e.g. on every 'moveend' while panning).
function refreshDenseLayerIncremental() {
  if (map.getZoom() < DENSE_ZOOM || !allPoints.length) return;
  const withLabel = map.getZoom() >= LABEL_ZOOM;
  const bounds = map.getBounds().pad(0.3); // small buffer so points don't pop in/out abruptly
  const wantNames = new Set();

  for (let i = 0; i < allPoints.length; i++) {
    const p = allPoints[i];
    if (!bounds.contains([p.lat, p.lng])) continue;
    wantNames.add(p.n);
    if (!denseMarkers.has(p.n)) {
      const c = makeCircleMarker(p, withLabel);
      denseMarkers.set(p.n, c);
      denseLayer.addLayer(c);
    }
  }

  for (const [name, marker] of denseMarkers) {
    if (!wantNames.has(name)) {
      denseLayer.removeLayer(marker);
      denseMarkers.delete(name);
    }
  }
}

// Full rebuild: used only when the zoom level itself changes, since that
// also changes whether labels should be attached to each point.
function rebuildDenseLayer() {
  denseLayer.clearLayers();
  denseMarkers.clear();
  refreshDenseLayerIncremental();
}

function loadFailed(err) {
  console.error(err);
}

fetch('data.csv')
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  })
  .then(csvText => {
    // Synchronous parse: for a file this size, this is faster than
    // worker:true, whose fixed cost (spinning up a Worker + copying the
    // CSV text and the parsed results across the thread boundary) was
    // outweighing the parse time itself and delaying the first paint.
    const parsed = Papa.parse(csvText, {
      header: true,
      dynamicTyping: false,
      skipEmptyLines: true
    });

    const data = [];
    parsed.data.forEach(row => {
      const name = (row.NAME || '').trim();
      const lat = parseFloat(row.latitude);
      const lng = parseFloat(row.longitude);
      if (!name || isNaN(lat) || isNaN(lng)) return; // skip blank/invalid rows (e.g. "unavailable")
      // Color is resolved once here, so drawing later is just a property read.
      const partner = (row.Partner || '').trim();
      const color = PARTNER_COLORS.get(partner) || DEFAULT_POINT_COLOR;
      const ont = (row['Installed ONTs'] || '').trim();
      data.push({
        n: name, search: name.toUpperCase(), lat: lat, lng: lng, c: color,
        pt: partner || 'Unknown', ont: ont || 'Unknown'
      });
    });

    allPoints = data;

    const clusterMarkers = [];

    data.forEach(p => {
      pointByName[p.n] = p;

      // Regular marker, used while clustered (zoom < DENSE_ZOOM)
      const m = L.marker([p.lat, p.lng], { icon: getPointIcon(p.c) });
      m.bindPopup(popupContent(p));
      clusterMarkers.push(m);
    });

    clusterGroup.addLayers(clusterMarkers);
    // Force a real render here: if auto-locate already panned/zoomed the
    // map (and fired zoomend) before this data finished loading,
    // denseMode/labelMode may already "match" the current zoom even
    // though the dense layer was built empty at that time (no points
    // existed yet). Resetting to null makes updateActiveLayer() treat
    // this as a genuine mode change and actually populate it now.
    denseMode = null;
    labelMode = null;
    updateActiveLayer(); // adds whichever layer matches the current zoom
  })
  .catch(loadFailed);

// Explicit mode flags so we only ever rebuild the dense layer when one of
// these actually flips (e.g. 11.75->12 or 17.75->18), not on every
// fractional zoomend (12->12.25->12.5->...) which zoomSnap:0.25 produces
// constantly. This was the single biggest source of unnecessary work on
// every zoom step.
let denseMode = null; // null forces the first call to always run
let labelMode = null;

function updateActiveLayer() {
  const wantDense = map.getZoom() >= DENSE_ZOOM;
  const wantLabels = map.getZoom() >= LABEL_ZOOM;

  if (wantDense !== denseMode) {
    denseMode = wantDense;
    if (denseMode) {
      if (map.hasLayer(clusterGroup)) map.removeLayer(clusterGroup);
      labelMode = wantLabels; // adopt label state as part of this rebuild
      rebuildDenseLayer();
      if (!map.hasLayer(denseLayer)) map.addLayer(denseLayer);
    } else {
      if (map.hasLayer(denseLayer)) {
        map.removeLayer(denseLayer);
        denseLayer.clearLayers();
        denseMarkers.clear();
      }
      if (!map.hasLayer(clusterGroup)) map.addLayer(clusterGroup);
    }
    return;
  }

  // Still in dense mode, but the label requirement itself changed
  // (crossed LABEL_ZOOM in either direction) — rebuild just for that.
  if (denseMode && wantLabels !== labelMode) {
    labelMode = wantLabels;
    rebuildDenseLayer();
  }
  // Any other zoomend (fractional step within the same mode) does nothing.
}
map.on('zoomend', updateActiveLayer);
map.on('moveend', () => {
  // Pure panning (zoom unchanged): cheap incremental add/remove only.
  refreshDenseLayerIncremental();
});

const input = document.getElementById('searchInput');
const suggBox = document.getElementById('suggestions');

function renderSuggestions(matches) {
  if (matches.length === 0) {
    suggBox.style.display = 'none';
    return;
  }
  suggBox.innerHTML = matches.slice(0, 25).map(p =>
    '<div data-name="' + p.n + '">' + p.n + '</div>'
  ).join('');
  suggBox.style.display = 'block';
}

// The box now recognizes three input shapes and reacts the instant the
// typed/pasted text matches one of them - no Enter needed:
//   1. FAT code    - 19 characters total, exactly 3 "-" (e.g. 722-R01-FDT01-FAT17)
//   2. Decimal Degrees - only digits/spaces/"."/"," , with exactly two "."
//      and two numbers (comma or space between them), e.g. "36.868, 42.945726"
//   3. DMS         - contains exactly two °, two ', two " and both N and E,
//      e.g. 36°52'06.4"N 42°56'45.0"E
// Because each shape needs different punctuation, the input is no longer
// stripped down to only A-Z0-9- : every character any of the three formats
// uses is kept (letters/digits/dash, or digits/./,/space, or °'"NE), and only
// characters none of them use (other symbols, other scripts) are dropped.
// Detection then looks at the shape of the cleaned text, so a coordinate
// that's still being typed is never mistaken for a FAT-code prefix and vice
// versa. Letters are still forced to CAPITAL (harmless for digits/symbols,
// and N/E need to be uppercase anyway). The caret position is preserved so
// editing in the middle of the text doesn't jump to the end.
//
// A space is kept ONLY when it sits directly between two digits - that's
// the one place a space is meaningful: the separator between the two
// numbers of a Decimal Degrees pair (e.g. "36.868 42.945"). Every other
// space - leading, trailing, doubled, next to a letter/dash/comma/symbol -
// is removed, same as before these coordinate formats were added.
const SEARCH_CODE_LENGTH = 19;

function cleanSearchText(s) {
  let out = s.toUpperCase().replace(/[^A-Z0-9\-.,°'"\s]/g, '');
  out = out.replace(/\s+/g, ' ');
  out = out.replace(/(\d) (\d)/g, '$1\u0001$2');
  out = out.replace(/ /g, '');
  out = out.replace(/\u0001/g, ' ');
  return out;
}

function sanitizeSearchInput() {
  const raw = input.value;
  const clean = cleanSearchText(raw);
  if (clean !== raw) {
    const pos = input.selectionStart;
    const cleanBefore = cleanSearchText(raw.slice(0, pos));
    input.value = clean;
    input.setSelectionRange(cleanBefore.length, cleanBefore.length);
  }
  return clean;
}

// North Iraq means latitude (~36) is always the smaller of the two numbers
// and longitude (~42) the larger, whichever order the user typed them in -
// so the smaller value is always taken as latitude, the larger as longitude.
// This both auto-detects which is which AND silently corrects a swapped
// entry.
function tryDecimalSearch(q) {
  if (!/^[0-9.,\s]+$/.test(q)) return false;
  if ((q.match(/\./g) || []).length !== 2) return false;
  const tokens = q.split(/[,\s]+/).filter(Boolean);
  if (tokens.length !== 2) return false;
  const a = parseFloat(tokens[0]);
  const b = parseFloat(tokens[1]);
  if (!isFinite(a) || !isFinite(b)) return false;
  showCoordResult(Math.min(a, b), Math.max(a, b));
  return true;
}

function tryDMSSearch(q) {
  if ((q.match(/°/g) || []).length !== 2) return false;
  if ((q.match(/'/g) || []).length !== 2) return false;
  if ((q.match(/"/g) || []).length !== 2) return false;
  if (!q.includes('N') || !q.includes('E')) return false;

  const re = /(\d+(?:\.\d+)?)\s*°\s*(\d+(?:\.\d+)?)\s*'\s*(\d+(?:\.\d+)?)\s*"/g;
  const values = [];
  let m;
  while ((m = re.exec(q)) !== null) {
    values.push(parseFloat(m[1]) + parseFloat(m[2]) / 60 + parseFloat(m[3]) / 3600);
  }
  if (values.length !== 2) return false;

  showCoordResult(Math.min(values[0], values[1]), Math.max(values[0], values[1]));
  return true;
}

// ---- FAT-code auto-advance (PREFIX-R0X-FDTXX-FATXX, e.g. 108-R01-FDT11-FAT99) ----
// The dashes and the literal "R0" / "FDT" / "FAT" text are inserted
// automatically as the person types forward, so they only ever type the
// meaningful digits/letters: 3 chars, then 1 digit, then 2 digits, then 2
// digits. This only ever runs while characters are being ADDED - Backspace
// and Delete are left completely alone (plain, default, one character at a
// time), so removing text never triggers any extra insertion or jumping.
const FAT_SEGMENTS = [
  { literal: '', len: 3 },    // prefix, e.g. "108" / "MLT"
  { literal: 'R0', len: 1 },  // -> "R01"
  { literal: 'FDT', len: 2 }, // -> "FDT11"
  { literal: 'FAT', len: 2 }  // -> "FAT99"
];
const FAT_FREE_LEN = FAT_SEGMENTS.reduce((n, s) => n + s.len, 0); // 8

// True only while the text is unambiguously FAT-code-shaped - i.e. it has
// none of the characters that only a coordinate search uses. Decimal/DMS
// input in progress must never be touched by this.
function looksLikeFatInProgress(text) {
  return !/[.,°'"]/.test(text);
}

// Pull the meaningful typed characters back out of a (possibly already
// auto-formatted) FAT-shaped string, so buildFatSkeleton can re-render it
// with the next literal appended.
function parseFatFree(text) {
  const parts = text.split('-');
  let free = '';
  for (let i = 0; i < FAT_SEGMENTS.length && i < parts.length; i++) {
    const seg = FAT_SEGMENTS[i];
    let part = parts[i];
    if (seg.literal) {
      if (part.startsWith(seg.literal)) {
        part = part.slice(seg.literal.length);
      } else {
        // The expected literal isn't there (the person edited it by hand) -
        // stop trying to interpret the structure and just take the rest of
        // the text as-is, rather than fighting their edit.
        free += parts.slice(i).join('');
        return free.slice(0, FAT_FREE_LEN);
      }
    }
    free += part;
  }
  if (parts.length > FAT_SEGMENTS.length) free += parts.slice(FAT_SEGMENTS.length).join('');
  return free.slice(0, FAT_FREE_LEN);
}

// Forward of parseFatFree: render the free characters typed so far as the
// full "PREFIX-R0X-FDTXX-FATXX" skeleton, stopping as soon as a segment
// isn't fully typed yet (so it never invents digits the person hasn't
// entered).
function buildFatSkeleton(free) {
  const out = [];
  let i = 0;
  for (const seg of FAT_SEGMENTS) {
    const slice = free.slice(i, i + seg.len);
    i += slice.length;
    out.push(seg.literal + slice);
    if (slice.length < seg.len) break;
  }
  return out.join('-');
}

function autoFormatFat(text) {
  if (!looksLikeFatInProgress(text)) return text;
  return buildFatSkeleton(parseFatFree(text));
}

function handleSearchInput(e) {
  let q = sanitizeSearchInput();

  if (tryDMSSearch(q)) return;
  if (tryDecimalSearch(q)) return;

  // Only auto-advance while adding characters. Backspace/Delete (and
  // cutting a selection) are deliberately left as plain, ordinary deletion
  // with no extra behavior.
  const isDeleting = !!e && typeof e.inputType === 'string' && e.inputType.indexOf('delete') === 0;
  if (!isDeleting) {
    const formatted = autoFormatFat(q);
    if (formatted !== q) {
      q = formatted;
      input.value = q; // caret lands at the end, which is what forward typing wants
    }
  }

  // A full FAT code (19 characters, exactly 3 "-") was typed/pasted: jump
  // straight to it.
  const dashCount = (q.match(/-/g) || []).length;
  if (q.length === SEARCH_CODE_LENGTH && dashCount === 3) {
    const exact = allPoints.find(p => p.search === q);
    if (exact) {
      goToPoint(exact.n);
      return;
    }
  }

  if (q.length < 1) { suggBox.style.display = 'none'; return; }
  const matches = allPoints.filter(p => p.search.startsWith(q));
  renderSuggestions(matches);
}

input.addEventListener('input', handleSearchInput);

suggBox.addEventListener('click', (e) => {
  const el = e.target.closest('div[data-name]');
  if (!el) return;
  goToPoint(el.getAttribute('data-name'));
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const q = input.value.trim().toUpperCase();
    const exact = allPoints.find(p => p.search === q);
    if (exact) { goToPoint(exact.n); return; }
    const matches = allPoints.filter(p => p.search.startsWith(q));
    if (matches.length === 1) goToPoint(matches[0].n);
  }
});

// Where the found FAT appears vertically on the map: 0.3 = 30% down from the
// top edge (70% left below it). Leaves room for the mobile keyboard, which
// covers the lower part of the screen while typing in the search box.
const FAT_SCREEN_Y_RATIO = 0.3;

function goToPoint(name) {
  const p = pointByName[name];
  if (!p) return;
  suggBox.style.display = 'none';
  input.value = name;

  // setView puts the target at the map's center (50%). To make the FAT land
  // at 30% instead, aim the map center below the FAT by the 20% difference.
  const zoom = 19;
  const size = map.getSize();
  const centerPx = map.project([p.lat, p.lng], zoom)
    .add([0, size.y * (0.5 - FAT_SCREEN_Y_RATIO)]);
  map.setView(map.unproject(centerPx, zoom), zoom, { animate: true });

  // autoPan:false - by default Leaflet nudges the map to fit the popup on
  // screen, which would push the FAT away from the position set above (and
  // it fought with the setView animation). The popup opens above the point
  // and fits fine inside the map, so no nudging is needed.
  L.popup({ autoPan: false })
    .setLatLng([p.lat, p.lng])
    .setContent(popupContent(p))
    .openOn(map);
}

// ---- Coordinate search result (Decimal Degrees / DMS) ----
// A yellow circle-with-crosshair, deliberately unlike every other marker on
// the map (blue FAT dots, gray cluster dots, black user dot), so a
// coordinate you searched for is never mistaken for a real FAT point. A
// single marker is reused and just moved for each new search.
const coordIcon = L.divIcon({
  className: 'coord-icon',
  html:
    '<svg viewBox="0 0 32 32" width="32" height="32" style="overflow:visible">' +
    '<circle cx="16" cy="16" r="9" fill="none" stroke="#000" stroke-width="5"/>' +
    '<line x1="16" y1="3" x2="16" y2="29" stroke="#000" stroke-width="5"/>' +
    '<line x1="3" y1="16" x2="29" y2="16" stroke="#000" stroke-width="5"/>' +
    '<circle cx="16" cy="16" r="9" fill="none" stroke="#FFD400" stroke-width="3"/>' +
    '<line x1="16" y1="4" x2="16" y2="28" stroke="#FFD400" stroke-width="3"/>' +
    '<line x1="4" y1="16" x2="28" y2="16" stroke="#FFD400" stroke-width="3"/>' +
    '</svg>',
  iconSize: [32, 32],
  iconAnchor: [16, 16]
});
let coordMarker = null;

function showCoordResult(lat, lng) {
  suggBox.style.display = 'none';

  const content = lat.toFixed(6) + ', ' + lng.toFixed(6) + '<br>' +
    '<a href="https://www.google.com/maps?q=' + lat + ',' + lng + '" target="_blank">Open in Google Maps</a>';

  if (!coordMarker) {
    coordMarker = L.marker([lat, lng], { icon: coordIcon, zIndexOffset: 950 }).addTo(map);
  } else {
    coordMarker.setLatLng([lat, lng]);
  }
  coordMarker.unbindPopup().bindPopup(content, { autoPan: false });

  const zoom = 17;
  const size = map.getSize();
  const centerPx = map.project([lat, lng], zoom)
    .add([0, size.y * (0.5 - FAT_SCREEN_Y_RATIO)]);
  map.setView(map.unproject(centerPx, zoom), zoom, { animate: true });
  // Popup is bound but not opened - it only shows when the user taps the
  // marker, unlike a FAT-code search which opens its popup right away.
}

// ---- Layer switcher (Google Satellite / Esri Satellite / Street) ----
const layerBtn = document.getElementById('layerBtn');
const layerMenu = document.getElementById('layerMenu');
const baseLayers = { google: googleLayer, esri: esriLayer, street: streetLayer };
let activeBaseLayer = googleLayer;

layerBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  layerMenu.classList.toggle('open');
});

layerMenu.addEventListener('click', (e) => {
  const el = e.target.closest('div[data-layer]');
  if (!el) return;
  const choice = el.getAttribute('data-layer');
  const newLayer = baseLayers[choice];
  if (!newLayer || newLayer === activeBaseLayer) { layerMenu.classList.remove('open'); return; }

  layerMenu.querySelectorAll('div').forEach(d => d.classList.remove('selected'));
  el.classList.add('selected');

  map.removeLayer(activeBaseLayer);
  map.addLayer(newLayer);
  activeBaseLayer = newLayer;

  layerMenu.classList.remove('open');
});

document.addEventListener('click', (e) => {
  if (!document.getElementById('searchBox').contains(e.target)) {
    suggBox.style.display = 'none';
  }
  if (!layerMenu.contains(e.target) && e.target !== layerBtn) {
    layerMenu.classList.remove('open');
  }
});

// ---- Locate me ----
const locateBtn = document.getElementById('locateBtn');
let userMarker = null;
let watchId = null;

const userIcon = L.divIcon({ className: 'user-icon', html: '<div class="user-dot"></div>', iconSize: [16,16] });

let lastFixTime = 0;

function updateUserMarker(lat, lng) {
  if (!userMarker) {
    userMarker = L.marker([lat, lng], { icon: userIcon, zIndexOffset: 1000 }).addTo(map);
    userMarker.bindPopup('You are here');
  } else {
    userMarker.setLatLng([lat, lng]);
  }
  lastFixTime = Date.now();
}

function onLocationFound(pos, recenter) {
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;
  updateUserMarker(lat, lng);
  if (recenter) map.setView([lat, lng], 17, { animate: true });
  locateBtn.classList.remove('active');
}

function onLocationError(err) {
  locateBtn.classList.remove('active');
  console.error(err);
  if (err.__userTriggered) {
    alert('Could not get your location. Please allow location access in your browser/phone settings.');
  }
}

function locateMe(userTriggered) {
  if (!navigator.geolocation) return;
  locateBtn.classList.add('active');
  // Auto-open: accept a cached fix up to 60s old so the app doesn't stall
  // waiting for a fresh GPS lock on first load. Manual button tap: always
  // force a fresh, high-accuracy read since the user explicitly asked.
  const options = userTriggered
    ? { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
    : { enableHighAccuracy: false, maximumAge: 60000, timeout: 5000 };
  navigator.geolocation.getCurrentPosition(
    (pos) => onLocationFound(pos, true),
    (err) => { err.__userTriggered = userTriggered; onLocationError(err); },
    options
  );
}

locateBtn.addEventListener('click', () => {
  if (!navigator.geolocation) {
    alert('Geolocation is not supported on this device.');
    return;
  }
  // The dot is already kept up to date by watchPosition (plus the 5s
  // watchdog below), so its current position IS the latest known location.
  // Jump there immediately instead of waiting several seconds for the phone
  // to produce a brand-new GPS fix.
  if (userMarker) {
    map.setView(userMarker.getLatLng(), 17, { animate: true });
    return;
  }
  // No location known yet (first fix still pending, or permission not
  // granted yet): fall back to a real request so the user gets the prompt/error.
  locateMe(true);
});

// Auto-locate on page open
locateMe(false);

// ---- Keep the red dot live: continuous tracking ----
// watchPosition fires automatically whenever the device reports a new fix
// (roughly every 1-2s while moving with GPS active). maximumAge:1000 lets it
// reuse a fix if one arrived less than a second ago, without ever forcing an
// extra GPS read the way a manual setInterval poll would. The marker moves
// on every update; the map itself is NOT re-centered here so it doesn't jump
// around while you're browsing it.
if (navigator.geolocation) {
  watchId = navigator.geolocation.watchPosition(
    (pos) => onLocationFound(pos, false),
    (err) => console.error('watchPosition error:', err),
    { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
  );
}

// Watchdog: if watchPosition goes quiet (no new fix) for more than 5s -
// e.g. the device throttles it in the background, or GPS briefly stalls -
// force a fresh one-off read so the dot never sits stale for long.
let forcingFix = false;
setInterval(() => {
  if (!navigator.geolocation || forcingFix) return;
  if (lastFixTime && Date.now() - lastFixTime > 5000) {
    forcingFix = true;
    navigator.geolocation.getCurrentPosition(
      (pos) => { onLocationFound(pos, false); forcingFix = false; },
      (err) => { console.error('forced fix error:', err); forcingFix = false; },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 }
    );
  }
}, 1000);

// ---- Google-Maps-style touch zoom gestures ----
// 1) Quick double-tap (release quickly): zoom in by one level. Handled
//    manually because iOS Safari can be unreliable with the native
//    dblclick-based zoom on touch.
// 2) Double-tap, then HOLD and drag up/down without lifting the finger:
//    handled by the leaflet-doubletapdragzoom plugin (loaded above),
//    which uses the exact same smooth engine as Leaflet's built-in
//    two-finger pinch-zoom — so it feels identical to pinch.
(function enableReliableQuickDoubleTapZoom() {
  let lastTapTime = 0;
  const container = map.getContainer();

  container.addEventListener('touchend', function (e) {
    if (e.touches.length > 0) return; // ignore mid multi-touch gestures
    const now = Date.now();
    const timeSinceLastTap = now - lastTapTime;

    if (timeSinceLastTap > 0 && timeSinceLastTap < 300) {
      const touch = e.changedTouches[0];
      const rect = container.getBoundingClientRect();
      const point = L.point(touch.clientX - rect.left, touch.clientY - rect.top);
      const latlng = map.containerPointToLatLng(point);
      map.setZoomAround(latlng, map.getZoom() + 1, { animate: true });
      e.preventDefault();
      lastTapTime = 0; // reset so a third tap doesn't chain another zoom
    } else {
      lastTapTime = now;
    }
  }, { passive: false });
})();


</script>
</body>
