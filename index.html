<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a4a4a" id="themeColorMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FAT Map</title>
<!-- MapLibre GL JS (WebGL renderer). Version pinned so an update can never
     change behaviour unexpectedly. -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.19.0/dist/maplibre-gl.css" />
<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://mt0.google.com">
<link rel="preconnect" href="https://server.arcgisonline.com">
<link rel="preconnect" href="https://tile.openstreetmap.org">
<style>
  html, body {
    margin:0; padding:0; font-family: 'Segoe UI', Tahoma, sans-serif;
    background:#4a4a4a;
    height:100%;
    height:100dvh;
    overflow:hidden;
  }
  #map { position:absolute; top:calc(64px + env(safe-area-inset-top, 0px)); bottom:0; left:0; right:0; background:#1b1b1b; }
  #map, #map * {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #map .maplibregl-popup-content,
  #map .maplibregl-popup-content * {
    -webkit-touch-callout: default;
    -webkit-user-select: text;
    user-select: text;
    cursor: text;
  }
  #map .maplibregl-popup-content a { cursor: pointer; }
  .maplibregl-popup-content { font-size:14px; line-height:1.45; padding:12px 26px 12px 14px; border-radius:10px; box-shadow:0 3px 14px rgba(0,0,0,.4); }
  .maplibregl-popup-close-button { font-size:20px; width:26px; height:26px; }
  .maplibregl-popup-content a { color:#0078A8; text-decoration:none; }

  #topbar {
    position:absolute; top:env(safe-area-inset-top, 0px); left:0; right:0;
    height:64px; z-index:1000;
    background:#4a4a4a; color:#fff; display:flex; align-items:center; gap:10px;
    padding:0 12px; box-shadow:0 2px 6px rgba(0,0,0,.25); box-sizing:border-box;
  }
  #searchBox { flex:1; position:relative; }
  #searchInput {
    width:100%; box-sizing:border-box; padding:10px 34px 10px 12px; border-radius:8px; border:none;
    font-size:15px; outline:none;
  }
  #searchInput::placeholder { color:#999; }
  #clearSearchBtn {
    position:absolute; top:50%; right:6px; transform:translateY(-50%);
    width:26px; height:26px; border:none; background:transparent; padding:0;
    cursor:pointer; display:none; align-items:center; justify-content:center;
  }
  #clearSearchBtn.visible { display:flex; }
  #clearSearchBtn svg { width:20px; height:20px; }
  #suggestions {
    position:absolute; top:44px; left:0; right:0; background:#fff; border-radius:8px;
    max-height:140px; overflow-y:auto; box-shadow:0 4px 14px rgba(0,0,0,.3); display:none; z-index:1001;
  }
  #suggestions div { padding:10px 12px; color:#222; cursor:pointer; border-bottom:1px solid #eee; font-size:14px; }
  #suggestions div:hover { background:#f2f2f2; }

  #layerWrap { position:relative; flex:none; }
  #locateBtn, #layerBtn {
    width:40px; height:40px; flex:none; border-radius:8px; border:none;
    background:#fff; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 4px rgba(0,0,0,.2);
  }
  #locateBtn svg, #layerBtn svg { width:22px; height:22px; fill:#1a73e8; }
  #locateBtn:active, #layerBtn:active { background:#eee; }
  #locateBtn.active { background:#1a73e8; }
  #locateBtn.active svg { fill:#fff; }
  #layerMenu {
    position:absolute; top:48px; right:0; background:#fff; border-radius:8px;
    box-shadow:0 4px 14px rgba(0,0,0,.3); display:none; z-index:1001; overflow:hidden; min-width:180px;
  }
  #layerMenu.open { display:block; }
  #layerMenu div { padding:10px 14px; color:#222; cursor:pointer; font-size:14px; }
  #layerMenu div:hover { background:#f2f2f2; }
  #layerMenu div.selected { font-weight:700; color:#1a73e8; }

  /* DOM markers (only a handful exist: you, the searched coordinate, measure points).
     The 100k FAT points are NOT DOM elements - they are drawn by WebGL. */
  .user-dot {
    width:16px; height:16px; border-radius:50%; background:#000;
    border:3px solid #fff; box-shadow:0 0 0 2px rgba(0,0,0,.4); box-sizing:border-box;
  }
  .user-icon, .coord-icon { pointer-events:none; } /* taps are resolved geometrically in onMapClick */

  #visitCounter {
    position:absolute; bottom:calc(8px + env(safe-area-inset-bottom, 0px)); left:8px; z-index:900;
    opacity:0.85; pointer-events:none;
  }
  #visitCounter img { display:block; height:20px; }

  /* Custom map controls (compass + measure), styled like the +/- buttons */
  .maplibregl-ctrl-group button.active,
  .maplibregl-ctrl-group button.active:hover { background:#1a73e8; color:#fff; }
  .ctrl-btn { display:flex !important; align-items:center; justify-content:center; color:#222; }
  .ctrl-btn svg { display:block; }
  .measure-wrap { position:relative; }
  .measure-wrap .maplibregl-ctrl-group { box-shadow:0 0 0 2px rgba(0,0,0,.1); }
  .measure-undo { display:none; margin-top:6px; }
  .measure-readout {
    position:absolute; right:calc(100% + 8px); top:2px;
    display:none; background:#fff; color:#000; font-weight:700; font-size:14px;
    padding:5px 10px; border-radius:6px; box-shadow:0 1px 5px rgba(0,0,0,.4);
    white-space:nowrap; pointer-events:none;
  }
  .measure-pt { width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:grab; }
  .measure-pt .mp-dot {
    width:12px; height:12px; box-sizing:border-box; border-radius:50%;
    background:#FFD400; border:2px solid #000; transition:transform .1s;
  }
  .measure-pt.dragging .mp-dot { transform:scale(1.5); }
  #map.measuring .maplibregl-canvas-container.maplibregl-interactive { cursor:crosshair; }

  #toast {
    position:fixed; left:50%; bottom:calc(56px + env(safe-area-inset-bottom, 0px));
    transform:translateX(-50%); z-index:2000; display:none; max-width:80%;
    background:rgba(0,0,0,.82); color:#fff; font-size:13px; text-align:center;
    padding:8px 14px; border-radius:8px; pointer-events:none;
  }

  #bottomBtns {
    position:fixed; right:8px; bottom:calc(8px + env(safe-area-inset-bottom, 0px)); z-index:1100;
    display:flex; gap:8px; align-items:center;
  }
  #filterBtn, #usageBtn {
    height:40px; padding:0 12px; border-radius:8px; border:2px solid transparent;
    background:#9e9e9e; color:#fff; font-size:13px; font-weight:700; cursor:pointer;
    white-space:nowrap; box-shadow:0 2px 4px rgba(0,0,0,.2); box-sizing:border-box;
    opacity:.6; -webkit-tap-highlight-color:transparent;
  }
  #filterBtn:active, #usageBtn:active { opacity:.8; }
  #filterBtn.active, #usageBtn.active { background:#ff0000; border-color:#fff; opacity:1; }
  #filterFrame {
    position:fixed; top:0; left:0; right:0; bottom:0; box-sizing:border-box;
    border:4px solid #e00000; z-index:1500; pointer-events:none; display:none;
  }
  html.filter-on #filterFrame { display:block; }
  html.filter-on, html.filter-on body { background:#d50000; }
  html.filter-on #topbar { background:#d50000; }
  html.filter-on #locateBtn svg, html.filter-on #layerBtn svg { fill:#d50000; }
  html.filter-on #locateBtn.active { background:#d50000; }
  html.filter-on #locateBtn.active svg { fill:#fff; }
</style>
</head>
<body>

<div id="topbar">
  <div id="searchBox">
    <input id="searchInput" type="text" placeholder="722-R01-FDT01-FAT01" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" />
    <button id="clearSearchBtn" title="Clear" aria-label="Clear">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#666" stroke-width="3"/><line x1="8.5" y1="8.5" x2="15.5" y2="15.5" stroke="#666" stroke-width="2.5" stroke-linecap="round"/><line x1="15.5" y1="8.5" x2="8.5" y2="15.5" stroke="#666" stroke-width="2.5" stroke-linecap="round"/></svg>
    </button>
    <div id="suggestions"></div>
  </div>
  <div id="layerWrap">
    <button id="layerBtn" title="Change map background">
      <svg viewBox="0 0 24 24"><path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"/></svg>
    </button>
    <div id="layerMenu">
      <div data-layer="google" class="selected">Google Satellite</div>
      <div data-layer="esri">Esri Satellite</div>
      <div data-layer="street">Street (OpenStreetMap)</div>
    </div>
  </div>
  <button id="locateBtn" title="Find my location">
    <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 3h-2.06A7.002 7.002 0 0 0 13 4.06V2h-2v2.06A7.002 7.002 0 0 0 4.06 11H2v2h2.06A7.002 7.002 0 0 0 11 19.94V22h2v-2.06A7.002 7.002 0 0 0 19.94 13H22v-2zm-9 7c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
  </button>
</div>
<div id="map"></div>
<div id="filterFrame"></div>
<div id="bottomBtns">
  <button id="usageBtn" title="Color points by Installed ONTs">Usage</button>
  <button id="filterBtn" title="Show only FATs with 0 installed ONTs">Filter 0 User</button>
</div>
<div id="toast"></div>
<div id="visitCounter">
  <img src="https://visitor-badge.laobi.icu/badge?page_id=masiraq.fat-map.github.io&left_color=gray&right_color=blue" alt="visits" />
</div>

<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.19.0/dist/maplibre-gl.mjs';

// =============================================================================
// WHY THIS IS FAST
// All 100k FAT points live in ONE GeoJSON source. MapLibre indexes and
// clusters them in a Web Worker (off the main thread) and draws them with
// WebGL on the GPU, so pan / pinch / zoom / rotate never rebuild anything in
// JavaScript - every frame is just a GPU redraw. Nothing in this file loops
// over all points during a gesture; taps use queryRenderedFeatures, which
// looks only at what is drawn under the finger (spatially indexed).
// =============================================================================

// ---- Basemap providers (fallback order: Google -> Esri -> OpenStreetMap) ----
const PROVIDERS = {
  google: {
    label: 'Google Satellite',
    url: 'https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
    subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
    maxNativeZoom: 20,
    gapProne: false,
    bust: true
  },
  esri: {
    label: 'Esri Satellite',
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    subdomains: ['a'],
    maxNativeZoom: 19,
    gapProne: true,
    bust: true
  },
  street: {
    label: 'OpenStreetMap',
    url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    subdomains: ['a', 'b', 'c'],
    maxNativeZoom: 19,
    gapProne: false,
    bust: false
  }
};
const FALLBACK_ORDER = ['google', 'esri', 'street'];
// NOTE on zoom numbers: MapLibre's zoom N shows the same scale as Leaflet's
// zoom N+1 (512px vs 256px world tiles). Every value below is the old Leaflet
// value minus 1, so everything appears at exactly the same scale as before.
const MAP_MAX_ZOOM = 19; // = Leaflet 20
const DENSE_ZOOM = 9;    // = Leaflet 10: clustering stops from this zoom
const LABEL_ZOOM = 17;   // = Leaflet 18: name labels appear from this zoom
const TILE_Z = () => map.getZoom() + 1; // zoom of the 256px basemap tiles being shown

function tileUrls(p) {
  return p.subdomains.map(s => p.url.replace('{s}', s));
}

// Every basemap is its own raster source + layer; only the active one is
// visible. A hidden layer's source requests no tiles at all.
const styleSources = {};
const styleLayers = [];
FALLBACK_ORDER.forEach((key, i) => {
  const p = PROVIDERS[key];
  styleSources['bm-' + key] = {
    type: 'raster', tiles: tileUrls(p), tileSize: 256, maxzoom: p.maxNativeZoom
  };
  styleLayers.push({
    id: 'bm-' + key, type: 'raster', source: 'bm-' + key,
    layout: { visibility: i === 0 ? 'visible' : 'none' },
    paint: { 'raster-fade-duration': 150 }
  });
});

const map = new maplibregl.Map({
  container: 'map',
  center: [42.97, 36.85],
  zoom: 9,
  maxZoom: MAP_MAX_ZOOM,
  maxPitch: 0,
  attributionControl: false,
  // Phones with 3x screens render 2.25x more pixels than 2x ones for
  // almost no visible gain on satellite imagery - capping at 2 keeps the
  // GPU comfortably inside the 16 ms/frame budget on mid-range Androids.
  pixelRatio: Math.min(window.devicePixelRatio || 1, 2),
  dragRotate: false,
  pitchWithRotate: false,
  touchPitch: false,
  fadeDuration: 0,
  style: {
    version: 8,
    // Only needed for the name labels (zoom 18+). Names use Latin letters,
    // digits and "-" only, so a single small glyph file (0-255) is ever loaded.
    glyphs: 'https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf',
    sources: styleSources,
    layers: styleLayers
  }
});
// Rotation is driven ONLY by the compass button (like before): no rotate gestures.
map.touchZoomRotate.disableRotation();
map.keyboard.disableRotation();
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

// Stop the native long-press menu from covering the map.
map.getContainer().addEventListener('contextmenu', (e) => e.preventDefault());

// ---- Small helpers ---------------------------------------------------------
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3000);
}

function dist2(a, b) { const dx = a.x - b.x, dy = a.y - b.y; return Math.sqrt(dx * dx + dy * dy); }

// Move the camera so that [lng,lat] ends up offsetY px from the screen centre.
// Short hops animate; long jumps (target off-screen or >4 zoom levels away)
// are instant - same behaviour Leaflet's setView had.
// Time until which a camera animation started by this file is running.
// The compass waits for it instead of interrupting it (setBearing would
// cut a search/locate animation short).
let cameraBusyUntil = 0;
function markCameraBusy(ms) { cameraBusyUntil = Math.max(cameraBusyUntil, performance.now() + ms + 50); }

function moveTo(lng, lat, zoom, offsetY) {
  const p = map.project([lng, lat]);
  const c = map.getContainer();
  const onScreen = p.x >= 0 && p.y >= 0 && p.x <= c.clientWidth && p.y <= c.clientHeight;
  const near = onScreen && Math.abs(zoom - map.getZoom()) <= 4;
  const duration = near ? 450 : 0;
  markCameraBusy(duration);
  map.easeTo({ center: [lng, lat], zoom: zoom, offset: [0, offsetY || 0], duration: duration });
}

// ---- Popups (one open at a time, like Leaflet) -----------------------------
let currentPopup = null;
let popupOpenedAt = 0;
let popupIsCoord = false;

function closePopup() {
  if (currentPopup) { const p = currentPopup; currentPopup = null; p.remove(); }
}

function openPopup(lngLat, html, offset, isCoord) {
  closePopup();
  const popup = new maplibregl.Popup({
    closeOnClick: false,         // map clicks are handled in onMapClick
    closeOnMove: false,
    maxWidth: '300px',
    offset: offset || 12,
    focusAfterOpen: false
  }).setLngLat(lngLat).setHTML(html).addTo(map);
  currentPopup = popup;
  popupOpenedAt = Date.now();
  popupIsCoord = !!isCoord;
  popup.on('close', () => { if (currentPopup === popup) currentPopup = null; });
  // Copy links ("Copy" FAT code / "Copy Location Coordinates")
  const link = popup.getElement().querySelector('.copy-text');
  if (link) {
    link.addEventListener('click', (ev) => {
      ev.preventDefault();
      const text = link.getAttribute('data-copy') || '';
      const label = link.getAttribute('data-label') || 'Copy';
      copyText(text).then(
        () => { link.textContent = 'Copied ✓'; },
        () => { link.textContent = 'Copy failed'; }
      ).then(() => { setTimeout(() => { link.textContent = label; }, 1500); });
    });
  }
  return popup;
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy') ? resolve() : reject(); }
    catch (e) { reject(e); }
    document.body.removeChild(ta);
  });
}

function popupContent(p) {
  return '<b>' + p.n + '</b> &nbsp;<a href="#" class="copy-text" data-copy="' + p.n + '" data-label="Copy">Copy</a><br>' +
    'Partner : ' + p.pt + '<br>' +
    'Area : ' + p.area + '<br>' +
    'Installed ONTs : ' + p.ont + '<br>' +
    '<a href="https://www.google.com/maps?q=' + p.lat + ',' + p.lng + '" target="_blank">Open in Google Maps</a>';
}
function openFatPopup(p) { openPopup([p.lng, p.lat], popupContent(p), 12, false); }

function formatDecimalCoords(lat, lng) { return lat.toFixed(6) + ', ' + lng.toFixed(6); }
function coordPopupContent(lat, lng) {
  const coords = formatDecimalCoords(lat, lng);
  return '<b>' + coords + '</b><br>' +
    '<a href="#" class="copy-text" data-copy="' + coords + '" data-label="Copy Location Coordinates">Copy Location Coordinates</a><br>' +
    '<a href="https://www.google.com/maps?q=' + lat + ',' + lng + '" target="_blank">Open in Google Maps</a>';
}

// ---- FAT point data + colors ------------------------------------------------
let allPoints = [];
let pointByName = {};
let usageOn = false;
let filterOn = false;
let pointsReady = false;

const USAGE_COLORS = ['#00FF00','#55DD55','#99BB99','#808080','#808080','#808080','#808080','#808080','#808080','#808080','#808080','#808080','#808080','#808080','#AA8080','#D55555','#FF0000'];
function usageColor(ontStr) {
  if (!/^\d+$/.test(ontStr)) return '#00FF00';
  const n = Number(ontStr);
  return n <= 16 ? USAGE_COLORS[n] : '#00FF00';
}
const DEFAULT_POINT_COLOR = '#808080';
const PARTNER_COLORS = new Map([
  ['Fiber Speed (Duhok)', '#FF0000'],
  ['Waarpak',             '#0080FF'],
  ['3BG',                 '#00B400'],
  ['Delta (Zakho)',       '#FF8000'],
  ['Delta (Duhok)',       '#FF8000'],
  ['Strong Link Duhok',   '#FF6699'],
  ['PrimeLink Duhok',     '#48B6E8'],
  ['BigLine',             '#00B400']
]);

// Two point sets: 'all' and 'zero' (Installed ONTs = 0). Each has its own
// clustered source so "Filter 0 User" is just a visibility switch - instant,
// clusters stay correct, nothing is re-sent to the worker.
const SETS = ['all', 'zero'];
const L_CL = s => 'cl-' + s, L_PT = s => 'pt-' + s, L_LB = s => 'lb-' + s;
function activeSet() { return filterOn ? 'zero' : 'all'; }
function hitLayers(withClusters) {
  const s = activeSet();
  return withClusters ? [L_CL(s), L_PT(s)] : [L_PT(s)];
}

function toFeatureCollection(points) {
  const features = new Array(points.length);
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    features[i] = {
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [p.lng, p.lat] },
      properties: { n: p.n, c: p.c, uc: p.uc }
    };
  }
  return { type: 'FeatureCollection', features: features };
}

function pointColorExpr() { return ['get', usageOn ? 'uc' : 'c']; }

function addPointLayers(data) {
  SETS.forEach(s => {
    map.addSource('fat-' + s, {
      type: 'geojson',
      data: s === 'zero' ? toFeatureCollection(data.filter(p => p.zero)) : toFeatureCollection(data),
      cluster: true,
      clusterMaxZoom: DENSE_ZOOM - 1,
      clusterRadius: 60,
      maxzoom: 16,     // tiles past z16 are overzoomed (still ~cm precision)
      buffer: 32
    });
    const vis = s === activeSet() ? 'visible' : 'none';
    map.addLayer({
      id: L_CL(s), type: 'circle', source: 'fat-' + s,
      filter: ['has', 'point_count'],
      layout: { visibility: vis },
      paint: {
        'circle-radius': 12, 'circle-color': '#808080',
        'circle-stroke-width': 3, 'circle-stroke-color': '#ffffff'
      }
    });
    map.addLayer({
      id: L_PT(s), type: 'circle', source: 'fat-' + s,
      filter: ['!', ['has', 'point_count']],
      layout: { visibility: vis },
      paint: {
        'circle-radius': 7, 'circle-color': pointColorExpr(),
        'circle-stroke-width': 2, 'circle-stroke-color': '#ffffff'
      }
    });
    map.addLayer({
      id: L_LB(s), type: 'symbol', source: 'fat-' + s,
      minzoom: LABEL_ZOOM,
      filter: ['!', ['has', 'point_count']],
      layout: {
        visibility: vis,
        'text-field': ['get', 'n'],
        'text-font': ['Noto Sans Medium'],
        'text-size': 11,
        'text-anchor': 'left',
        'text-offset': [1.1, 0],
        'text-max-width': 100,           // never wrap the code at its '-'
        'text-allow-overlap': true,      // every point keeps its name (as before)
        'text-ignore-placement': true
      },
      paint: { 'text-color': '#000000', 'text-halo-color': '#ffffff', 'text-halo-width': 1.6 }
    });
  });
}

function applyLayerVisibility() {
  if (!pointsReady) return;
  SETS.forEach(s => {
    const v = s === activeSet() ? 'visible' : 'none';
    [L_CL(s), L_PT(s), L_LB(s)].forEach(id => map.setLayoutProperty(id, 'visibility', v));
  });
}

// Nearest rendered FAT/cluster feature within r px of a screen point.
function nearestFeature(pt, r, withClusters) {
  if (!pointsReady) return null;
  const feats = map.queryRenderedFeatures([[pt.x - r, pt.y - r], [pt.x + r, pt.y + r]], { layers: hitLayers(withClusters) });
  let best = null, bestD = r;
  for (const f of feats) {
    const d = dist2(map.project(f.geometry.coordinates), pt);
    if (d <= bestD) { bestD = d; best = f; }
  }
  return best;
}
function nearestFat(pt, r) {
  if (map.getZoom() < DENSE_ZOOM) return null;
  const f = nearestFeature(pt, r, false);
  return f && !f.properties.cluster ? pointByName[f.properties.n] : null;
}

async function zoomIntoCluster(f) {
  try {
    const z = await map.getSource('fat-' + activeSet()).getClusterExpansionZoom(f.properties.cluster_id);
    markCameraBusy(400);
    map.easeTo({ center: f.geometry.coordinates, zoom: Math.min(z, MAP_MAX_ZOOM), duration: 400 });
  } catch (e) { console.error(e); }
}

let measuring = false;

let measureMarks = []; // their draggable markers
let measureTotal = 0;

function formatMeters(m) { return Math.round(m).toLocaleString('en-US') + ' m'; }

function ensureMeasureLayers() {
  if (map.getSource('measure')) return;
  map.addSource('measure', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({ id: 'measure-casing', type: 'line', source: 'measure',
    layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: { 'line-color': '#000', 'line-width': 6, 'line-opacity': 0.55 } });
  map.addLayer({ id: 'measure-line', type: 'line', source: 'measure',
    layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: { 'line-color': '#FFD400', 'line-width': 3 } });
}

function refreshMeasure() {
  measureTotal = 0;
  for (let k = 1; k < measurePts.length; k++) measureTotal += measurePts[k - 1].distanceTo(measurePts[k]);
  const src = map.getSource('measure');
  if (src) src.setData({ type: 'FeatureCollection', features: measurePts.length < 2 ? [] : [{
    type: 'Feature', properties: {},
    geometry: { type: 'LineString', coordinates: measurePts.map(p => [p.lng, p.lat]) }
  }] });
  measureOut.textContent = formatMeters(measureTotal);
  measureUndoBar.style.display = measurePts.length ? 'block' : 'none';
}

function setTapZoomGestures(on) {
  if (on) map.doubleClickZoom.enable(); else map.doubleClickZoom.disable();
  const tdz = map.touchZoomRotate && map.touchZoomRotate._tapDragZoom;
  if (tdz) { if (on) tdz.enable(); else tdz.disable(); }
}

function startMeasure() {
  measuring = true;
  ensureMeasureLayers();
  measurePts = []; measureMarks = [];
  refreshMeasure();
  measureBtn.classList.add('active');
  measureOut.style.display = 'block';
  map.getContainer().classList.add('measuring');
  closePopup();
  setTapZoomGestures(false); // a double-tap would otherwise drop stray points
}

function stopMeasure() {
  measuring = false;
  measureMarks.forEach(m => m.remove());
  measurePts = []; measureMarks = [];
  refreshMeasure();
  measureBtn.classList.remove('active');
  measureOut.style.display = 'none';
  map.getContainer().classList.remove('measuring');
  setTapZoomGestures(true);
}

function toggleMeasure() { if (measuring) stopMeasure(); else startMeasure(); }

// If the tap lands within ~14px of a FAT point (dense zoom), use its exact position.
function snapToFat(lngLat) {
  const fat = nearestFat(map.project(lngLat), 14);
  return fat ? new maplibregl.LngLat(fat.lng, fat.lat) : lngLat;
}

function addMeasurePoint(lngLat) {
  const ll = snapToFat(lngLat);
  const el = document.createElement('div');
  el.className = 'measure-pt';
  el.innerHTML = '<div class="mp-dot"></div>';
  const mk = new maplibregl.Marker({ element: el, draggable: true }).setLngLat(ll).addTo(map);
  mk.on('dragstart', () => el.classList.add('dragging'));
  mk.on('drag', () => {
    const i = measureMarks.indexOf(mk);
    if (i < 0) return;
    measurePts[i] = mk.getLngLat();
    refreshMeasure();
  });
  mk.on('dragend', () => {
    el.classList.remove('dragging');
    const i = measureMarks.indexOf(mk);
    if (i < 0) return;
    const snapped = snapToFat(mk.getLngLat());
    mk.setLngLat(snapped);
    measurePts[i] = snapped;
    refreshMeasure();
  });
  measurePts.push(ll);
  measureMarks.push(mk);
  refreshMeasure();
}

function undoMeasurePoint() {
  if (!measuring || !measurePts.length) return;
  measurePts.pop();
  measureMarks.pop().remove();
  refreshMeasure();
}

// ---- Compass rotation -------------------------------------------------------
let compassOn = false;
let compassBusy = false;
let compassBtn = null;
let compassSvg = null;
let compassEvt = null;
let compassTarget = null;  // smoothed sensor heading (0-360)
let compassShown = null;   // heading currently applied to the map
let compassRaf = null;
let compassWatchdog = null;

function angDiff(a, b) { return ((b - a + 540) % 360) - 180; }

function screenAngle() {
  let a = 0;
  if (window.screen && screen.orientation && typeof screen.orientation.angle === 'number') a = screen.orientation.angle;
  else if (typeof window.orientation === 'number') a = window.orientation;
  return ((a % 360) + 360) % 360;
}

function headingFromEuler(alpha, beta, gamma) {
  const r = Math.PI / 180;
  const a = alpha * r, b = beta * r, g = gamma * r;
  const sa = Math.sin(a), ca = Math.cos(a);
  const sb = Math.sin(b), cb = Math.cos(b);
  const sg = Math.sin(g), cg = Math.cos(g);
  let tx = -sa * cb, ty = ca * cb;
  let bx = -(ca * sg + sa * sb * cg), by = ca * sb * cg - sa * sg;
  const tl = Math.hypot(tx, ty) || 1, bl = Math.hypot(bx, by) || 1;
  tx /= tl; ty /= tl; bx /= bl; by /= bl;
  const w = Math.min(1, Math.max(0, (beta - 55) / 20));
  const x = tx * (1 - w) + bx * w, y = ty * (1 - w) + by * w;
  return (Math.atan2(x, y) * 180 / Math.PI + 360) % 360;
}

function onCompassEvent(e) {
  let h = null;
  if (typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)) {
    h = e.webkitCompassHeading;
  } else if (e.alpha !== null && e.alpha !== undefined) {
    if (compassEvt === 'deviceorientation' && e.absolute !== true) return;
    h = headingFromEuler(e.alpha, e.beta || 0, e.gamma || 0);
  }
  if (h === null || isNaN(h)) return;
  h = (h + screenAngle() + 360) % 360;
  clearTimeout(compassWatchdog);
  compassWatchdog = null;
  compassTarget = compassTarget === null ? h : (compassTarget + angDiff(compassTarget, h) * 0.25 + 360) % 360;
}

// Runs every display frame (60 fps) while the compass is on: eases the map
// towards the latest heading, so the rotation itself is perfectly smooth.
// MapLibre's bearing = the compass direction shown at the top of the screen,
// which is exactly the heading the person is facing.
function compassFrame() {
  if (!compassOn) return;
  compassRaf = requestAnimationFrame(compassFrame);
  if (compassTarget === null) return;
  if (performance.now() < cameraBusyUntil) return; // don't interrupt a search/locate camera move
  // Start from the map's current bearing (not the sensor's), so the very
  // first reading also turns the map - smoothly, instead of jumping.
  if (compassShown === null) compassShown = ((map.getBearing() % 360) + 360) % 360;
  const d = angDiff(compassShown, compassTarget);
  if (Math.abs(d) < 0.3) return;
  compassShown = (compassShown + d * 0.15 + 360) % 360;
  map.setBearing(compassShown);
  if (compassSvg) compassSvg.style.transform = 'rotate(' + (-compassShown) + 'deg)';
}

function disableCompass() {
  compassOn = false;
  if (compassEvt) { window.removeEventListener(compassEvt, onCompassEvent, true); compassEvt = null; }
  cancelAnimationFrame(compassRaf); compassRaf = null;
  clearTimeout(compassWatchdog); compassWatchdog = null;
  compassTarget = null;
  compassShown = null;
  map.easeTo({ bearing: 0, duration: 300 });
  if (compassSvg) compassSvg.style.transform = '';
  if (compassBtn) compassBtn.classList.remove('active');
}

async function enableCompass() {
  if (!('DeviceOrientationEvent' in window)) { showToast('Compass is not available on this device'); return; }
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    compassBusy = true;
    try {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res !== 'granted') { showToast('Compass permission was denied'); return; }
    } catch (err) {
      showToast('Compass permission was denied');
      return;
    } finally {
      compassBusy = false;
    }
  }
  compassEvt = ('ondeviceorientationabsolute' in window) ? 'deviceorientationabsolute' : 'deviceorientation';
  window.addEventListener(compassEvt, onCompassEvent, true);
  compassOn = true;
  compassRaf = requestAnimationFrame(compassFrame);
  compassBtn.classList.add('active');
  compassWatchdog = setTimeout(() => {
    if (compassOn && compassTarget === null) {
      disableCompass();
      showToast('Compass is not available on this device');
    }
  }, 3000);
}

class CompassControl {
  onAdd() {
    const bar = document.createElement('div');
    bar.className = 'maplibregl-ctrl maplibregl-ctrl-group';
    compassBtn = ctrlButton(bar, 'Rotate map with compass', COMPASS_ICON);
    compassSvg = compassBtn.firstChild;
    compassBtn.addEventListener('click', () => {
      if (compassBusy) return;
      if (compassOn) disableCompass(); else enableCompass();
    });
    return bar;
  }
  onRemove() {}
}

const LONG_PRESS_MS = 1000;
const LONG_PRESS_POINT_THRESHOLD_PX = 25;
const LONG_PRESS_MOVE_TOLERANCE_PX = 18;
const COORD_POPUP_OPEN_GRACE_MS = 400;
let longPressTimer = null;
let longPressStartPx = null;

function cancelLongPress() {
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  longPressStartPx = null;
}

function startLongPress(pt) {
  cancelLongPress();
  if (measuring) return;
  // Only looks at what's drawn under the finger - not a loop over 100k points.
  if (nearestFeature(pt, LONG_PRESS_POINT_THRESHOLD_PX, true)) return;
  longPressStartPx = pt;
  longPressTimer = setTimeout(() => {
    longPressTimer = null;
    const ll = map.unproject(pt);
    openPopup(ll, coordPopupContent(ll.lat, ll.lng), 4, true);
  }, LONG_PRESS_MS);
}

// Mouse (desktop)
map.on('mousedown', (e) => { if (e.originalEvent.button === 0) startLongPress(e.point); });
map.on('mousemove', (e) => {
  if (longPressTimer && longPressStartPx && dist2(e.point, longPressStartPx) > LONG_PRESS_MOVE_TOLERANCE_PX) cancelLongPress();
});
map.on('mouseup', cancelLongPress);
map.on('zoomstart', cancelLongPress);

// Touch (phones): built from raw touch events, independent of mouse emulation.
(function enableTouchLongPress() {
  const el = map.getCanvasContainer();
  function pointFromTouch(t) {
    const rect = el.getBoundingClientRect();
    return new maplibregl.Point(t.clientX - rect.left, t.clientY - rect.top);
  }
  el.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { cancelLongPress(); return; }
    if (e.target.closest && e.target.closest('.measure-pt')) return;
    startLongPress(pointFromTouch(e.touches[0]));
  }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    if (!longPressTimer || !longPressStartPx) return;
    if (e.touches.length !== 1 || dist2(pointFromTouch(e.touches[0]), longPressStartPx) > LONG_PRESS_MOVE_TOLERANCE_PX) cancelLongPress();
  }, { passive: true });
  el.addEventListener('touchend', cancelLongPress, { passive: true });
  el.addEventListener('touchcancel', cancelLongPress, { passive: true });
})();

// Priority mirrors the old Leaflet stacking: your dot, then the searched

  // While measuring, a TAP anywhere - even right on or next to an existing

  // (a drag never produces a click, so the two never conflict).
  if (measuring) {

    addMeasurePoint(e.lngLat);

const input = document.getElementById('searchInput');

function renderSuggestions(matches) {

const SEARCH_CODE_LENGTH = 19;

function cleanSearchText(s) {
  let out = s.toUpperCase().replace(/[^A-Z0-9\-.,°'"\s]/g, '');
  const nonSpace = out.replace(/\s/g, '');
  const spaceAllowed = !/[A-Z]/.test(nonSpace) && /\d/.test(nonSpace) && /\./.test(nonSpace);
  if (!spaceAllowed) {
    out = out.replace(/\s/g, '');
  } else {
    let seen = false;
    out = out.replace(/\s/g, () => (seen ? '' : (seen = true, ' ')));
  }
  return out;
}

function sanitizeSearchInput() {
  const raw = input.value;
  const clean = cleanSearchText(raw);
  if (clean !== raw) {
    const pos = input.selectionStart;
    const cleanBefore = cleanSearchText(raw.slice(0, pos));
    input.value = clean;
    input.setSelectionRange(cleanBefore.length, cleanBefore.length);
  }
  return clean;
}

function tryDecimalSearch(q) {
  if (!/^[0-9.,\s]+$/.test(q)) return false;
  if ((q.match(/\./g) || []).length !== 2) return false;
  const tokens = q.split(/[,\s]+/).filter(Boolean);
  if (tokens.length !== 2) return false;
  const a = parseFloat(tokens[0]);
  const b = parseFloat(tokens[1]);
  if (!isFinite(a) || !isFinite(b)) return false;
  showCoordResult(Math.min(a, b), Math.max(a, b));
  return true;
}

function tryDMSSearch(q) {
  if ((q.match(/°/g) || []).length !== 2) return false;
  if ((q.match(/'/g) || []).length !== 2) return false;
  if ((q.match(/"/g) || []).length !== 2) return false;
  if (!q.includes('N') || !q.includes('E')) return false;
  const re = /(\d+(?:\.\d+)?)\s*°\s*(\d+(?:\.\d+)?)\s*'\s*(\d+(?:\.\d+)?)\s*"/g;
  const values = [];
  let m;
  while ((m = re.exec(q)) !== null) {
    values.push(parseFloat(m[1]) + parseFloat(m[2]) / 60 + parseFloat(m[3]) / 3600);
  }
  if (values.length !== 2) return false;
  showCoordResult(Math.min(values[0], values[1]), Math.max(values[0], values[1]));
  return true;
}

// ---- FAT-code auto-advance (PREFIX-R0X-FDTXX-FATXX) ----
const FAT_SEGMENTS = [
  { literal: '', len: 3 },
  { literal: 'R0', len: 1 },
  { literal: 'FDT0', len: 1, altLiteral: 'FDT', altLen: 2 },
  { literal: 'FAT', len: 2 }
];
const FAT_FREE_LEN = FAT_SEGMENTS.reduce((n, s) => n + s.len, 0);

function looksLikeFatInProgress(text) { return !/[.,°'"]/.test(text); }

function parseFatFree(text) {
  const parts = text.split('-');
  let free = '';
  let fdtVariant = 'auto0';
  for (let i = 0; i < FAT_SEGMENTS.length && i < parts.length; i++) {
    const seg = FAT_SEGMENTS[i];
    let part = parts[i];
    if (seg.literal) {
      if (part.startsWith(seg.literal)) {
        part = part.slice(seg.literal.length);
      } else if (seg.altLiteral && part.startsWith(seg.altLiteral)) {
        part = part.slice(seg.altLiteral.length);
        fdtVariant = 'raw';
      } else {
        return null;
      }
    }
    free += part;
  }
  if (parts.length > FAT_SEGMENTS.length) free += parts.slice(FAT_SEGMENTS.length).join('');
  const maxLen = fdtVariant === 'raw' ? FAT_FREE_LEN + 1 : FAT_FREE_LEN;
  return { free: free.slice(0, maxLen), fdtVariant };
}

function buildFatSkeleton(parsed) {
  const { free, fdtVariant } = parsed;
  const segs = fdtVariant === 'raw'
    ? [FAT_SEGMENTS[0], FAT_SEGMENTS[1], { literal: 'FDT', len: 2 }, FAT_SEGMENTS[3]]
    : FAT_SEGMENTS;
  const out = [];
  let i = 0;
  for (let s = 0; s < segs.length; s++) {
    const seg = segs[s];
    const slice = free.slice(i, i + seg.len);
    i += slice.length;
    out.push(seg.literal + slice);
    if (slice.length < seg.len) break;
    if (s < segs.length - 1) {
      const soFar = out.join('-');
      if (!allPoints.some(p => p.search.startsWith(soFar))) break;
    }
  }
  return out.join('-');
}

function autoFormatFat(text) {
  if (!looksLikeFatInProgress(text)) return text;
  const parsed = parseFatFree(text);
  if (parsed === null) return text;
  return buildFatSkeleton(parsed);
}

function handleSearchInput(e) {
  let q = sanitizeSearchInput();
  updateClearSearchBtn();

  if (tryDMSSearch(q)) return;
  if (tryDecimalSearch(q)) return;

  const dashCount = (q.match(/-/g) || []).length;
  if (q.length === SEARCH_CODE_LENGTH && dashCount === 3) {
    const exact = allPoints.find(p => p.search === q);
    if (exact) { goToPoint(exact.n); return; }
  }

  const isDeleting = !!e && typeof e.inputType === 'string' && e.inputType.indexOf('delete') === 0;
  if (!isDeleting) {
    const formatted = autoFormatFat(q);
    if (formatted !== q) { q = formatted; input.value = q; }
  }

  if (q.length < 1) { suggBox.style.display = 'none'; return; }
  renderSuggestions(allPoints.filter(p => p.search.startsWith(q)));
}

input.addEventListener('input', handleSearchInput);

suggBox.addEventListener('click', (e) => {
  const el = e.target.closest('div[data-name]');
  if (!el) return;
  goToPoint(el.getAttribute('data-name'));
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const q = input.value.trim().toUpperCase();
    const exact = allPoints.find(p => p.search === q);
    if (exact) { goToPoint(exact.n); return; }
    const matches = allPoints.filter(p => p.search.startsWith(q));
    if (matches.length === 1) goToPoint(matches[0].n);
  }
});

// Found item lands 30% down from the top (room for the phone keyboard).
const FAT_SCREEN_Y_RATIO = 0.3;
let userSearched = false;

function goToPoint(name) {
  const p = pointByName[name];
  if (!p) return;
  userSearched = true;
  suggBox.style.display = 'none';
  input.value = name;
  updateClearSearchBtn();
  const h = map.getContainer().clientHeight;
  moveTo(p.lng, p.lat, 18, -h * (0.5 - FAT_SCREEN_Y_RATIO));
  openFatPopup(p);
}

function showCoordResult(lat, lng) {
  userSearched = true;
  suggBox.style.display = 'none';
  coordPopupHtml = lat.toFixed(6) + ', ' + lng.toFixed(6) + '<br>' +
    '<a href="https://www.google.com/maps?q=' + lat + ',' + lng + '" target="_blank">Open in Google Maps</a>';
  if (!coordMarker) {
    coordMarker = new maplibregl.Marker({ element: coordMarkerEl() }).setLngLat([lng, lat]).addTo(map);
  } else {
    coordMarker.setLngLat([lng, lat]);
  }
  const h = map.getContainer().clientHeight;
  moveTo(lng, lat, 16, -h * (0.5 - FAT_SCREEN_Y_RATIO));
}

// ---- Layer switcher + automatic basemap fallback ---------------------------
const layerBtn = document.getElementById('layerBtn');
const layerMenu = document.getElementById('layerMenu');
let activeKey = 'google';
let userKey = 'google';

const WINDOW_MS = 15000;
const ERR_MIN = 5;
const ERR_RATIO = 0.5;
const DEGRADED_ERR_MIN = 8;
const DEGRADED_RATIO = 0.7;
const GAP_ZOOM = 17;  // tile zoom
const CHECK_COOLDOWN_MS = 15000;
// Generous on purpose: on a slow connection a tile can take several seconds
// and that must not be mistaken for the provider being down.
const PROBE_TIMEOUT_MS = 12000;
const RECOVERY_INTERVAL_MS = 10 * 60 * 1000;

const tileEvents = [];
let checking = false;
let lastCheckAt = 0;

function probeTile(key, lat, lng, z) {
  const p = PROVIDERS[key];
  const n = Math.pow(2, z);
  const x = Math.floor((lng + 180) / 360 * n);
  const latR = lat * Math.PI / 180;
  const y = Math.floor((1 - Math.log(Math.tan(latR) + 1 / Math.cos(latR)) / Math.PI) / 2 * n);
  let url = p.url.replace('{s}', p.subdomains[0]).replace('{x}', x).replace('{y}', y).replace('{z}', z);
  if (p.bust) url += (url.indexOf('?') >= 0 ? '&' : '?') + '_probe=' + Date.now();
  return new Promise(resolve => {
    const img = new Image();
    let done = false;
    let timer = null;
    const finish = ok => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      img.onload = img.onerror = null;
      resolve(ok);
    };
    timer = setTimeout(() => finish(false), PROBE_TIMEOUT_MS);
    img.onload = () => finish(img.naturalWidth === 256 && img.naturalHeight === 256);
    img.onerror = () => finish(false);
    img.src = url;
  });
}

function probeCenter() {
  const c = map.getCenter().wrap();
  return { lat: c.lat, lng: c.lng, z: Math.max(2, Math.min(10, Math.round(TILE_Z()))) };
}

function setBaseLayer(key) {
  if (!PROVIDERS[key]) return;
  FALLBACK_ORDER.forEach(k => map.setLayoutProperty('bm-' + k, 'visibility', k === key ? 'visible' : 'none'));
  activeKey = key;
  tileEvents.length = 0;
  lastCheckAt = 0;
  layerMenu.querySelectorAll('div[data-layer]').forEach(d => {
    d.classList.toggle('selected', d.getAttribute('data-layer') === key);
  });
}

function currentStats() {
  const now = Date.now();
  while (tileEvents.length && now - tileEvents[0].t > WINDOW_MS) tileEvents.shift();
  let err = 0;
  for (const e of tileEvents) if (!e.ok) err++;
  return { err: err, total: tileEvents.length };
}

async function verifyAndMaybeSwitch() {
  if (checking) return;
  checking = true;
  lastCheckAt = Date.now();
  try {
    if (navigator.onLine === false) return;
    const failing = activeKey;
    const rest = FALLBACK_ORDER.slice(FALLBACK_ORDER.indexOf(failing) + 1);
    if (!rest.length) return;
    const pc = probeCenter();
    const results = await Promise.all([failing].concat(rest).map(k => probeTile(k, pc.lat, pc.lng, pc.z)));
    if (activeKey !== failing) return;
    if (results[0]) {
      if (PROVIDERS[failing].gapProne && TILE_Z() >= GAP_ZOOM) return;
      const now = currentStats();
      if (now.err < DEGRADED_ERR_MIN || now.err / now.total < DEGRADED_RATIO) return;
    }
    const idx = results.slice(1).indexOf(true);
    if (idx < 0) return;
    const next = rest[idx];
    setBaseLayer(next);
    showToast(PROVIDERS[failing].label + ' unavailable - switched to ' + PROVIDERS[next].label);
  } finally {
    checking = false;
  }
}

// MapLibre reports every loaded tile as a 'data' event and every failed one
// as an 'error' event (404 = "no imagery here" is NOT reported as an error).
map.on('data', (e) => {
  if (!e.tile || e.sourceId !== 'bm-' + activeKey) return;
  tileEvents.push({ t: Date.now(), ok: true });
});
map.on('error', (e) => {
  if (!e.sourceId || !e.sourceId.startsWith('bm-')) { if (e.error) console.error(e.error); return; }
  if (e.sourceId !== 'bm-' + activeKey) return;
  tileEvents.push({ t: Date.now(), ok: false });
  if (checking || Date.now() - lastCheckAt < CHECK_COOLDOWN_MS) return;
  const st = currentStats();
  if (st.err >= ERR_MIN && st.err / st.total >= ERR_RATIO) verifyAndMaybeSwitch();
});

async function tryRecoverPreferred() {
  if (checking || document.hidden || navigator.onLine === false) return;
  const i = FALLBACK_ORDER.indexOf(userKey);
  const j = FALLBACK_ORDER.indexOf(activeKey);
  if (i < 0 || j < 0 || i >= j) return;
  checking = true;
  try {
    const cands = FALLBACK_ORDER.slice(i, j);
    const c = map.getCenter().wrap();
    const zNow = Math.max(2, Math.round(TILE_Z()));
    const res = await Promise.all(cands.map(k =>
      probeTile(k, c.lat, c.lng, Math.min(zNow, PROVIDERS[k].maxNativeZoom))));
    if (activeKey !== FALLBACK_ORDER[j]) return;
    const idx = res.indexOf(true);
    if (idx < 0) return;
    const back = cands[idx];
    setBaseLayer(back);
    showToast(PROVIDERS[back].label + ' is available again');
  } finally {
    checking = false;
  }
}
setInterval(tryRecoverPreferred, RECOVERY_INTERVAL_MS);
window.addEventListener('online', tryRecoverPreferred);

layerBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  layerMenu.classList.toggle('open');
});
layerMenu.addEventListener('click', (e) => {
  const el = e.target.closest('div[data-layer]');
  if (!el) return;
  const key = el.getAttribute('data-layer');
  if (PROVIDERS[key]) {
    userKey = key;
    if (map.isStyleLoaded()) setBaseLayer(key); else mapLoaded.then(() => setBaseLayer(key));
  }
  layerMenu.classList.remove('open');
});
document.addEventListener('click', (e) => {
  if (!document.getElementById('searchBox').contains(e.target)) suggBox.style.display = 'none';
  if (!layerMenu.contains(e.target) && e.target !== layerBtn) layerMenu.classList.remove('open');
});

// ---- Visit log (Google Sheets) ---------------------------------------------
const VISIT_LOG_URL = 'https://script.google.com/macros/s/AKfycbz3U-pu2BFU0HWQqH-XfU_xydoLyTfMCcNjPVCLoHbVp6V1TXwJaaVjOUWtvNx2GIFs/exec';
let visitLogged = false;

function getDeviceId() {
  try {
    let id = localStorage.getItem('deviceId');
    if (!id) {
      id = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'd-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
      localStorage.setItem('deviceId', id);
    }
    return id;
  } catch (e) {
    return 'd-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }
}

const ACCURACY_STEPS = [
  { until: 2000,  max: 25   },
  { until: 4000,  max: 50   },
  { until: 6000,  max: 80   },
  { until: 8000,  max: 150  },
  { until: 10000, max: 250  },
  { until: 12000, max: 1000 }
];
const MAX_WAIT_MS = 12000;
const NO_FIX_MAX_WAIT_MS = 30000;
const logStart = Date.now();
let firstFixTime = null;
let bestFix = null;

function allowedAccuracy() {
  if (firstFixTime === null) return 0;
  const t = Date.now() - firstFixTime;
  for (const step of ACCURACY_STEPS) if (t < step.until) return step.max;
  return 0;
}

function logVisitOnce(lat, lng, accuracy) {
  if (visitLogged || VISIT_LOG_URL.indexOf('PASTE_') === 0) return;
  visitLogged = true;
  const hasLoc = isFinite(lat) && isFinite(lng);
  const body = JSON.stringify({
    id: getDeviceId(),
    lat: hasLoc ? Number(lat.toFixed(6)) : '',
    lng: hasLoc ? Number(lng.toFixed(6)) : '',
    accuracy: hasLoc && isFinite(accuracy) ? Math.round(accuracy) : ''
  });
  try {
    fetch(VISIT_LOG_URL, { method: 'POST', mode: 'no-cors', keepalive: true,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body }).catch(() => {});
  } catch (e) {}
}

function checkAndLog() {
  if (visitLogged || !bestFix) return;
  if (bestFix.accuracy <= allowedAccuracy()) logVisitOnce(bestFix.lat, bestFix.lng, bestFix.accuracy);
}

function considerForLog(pos) {
  if (visitLogged) return;
  const c = pos.coords;
  if (firstFixTime === null) firstFixTime = Date.now();
  if (!bestFix || c.accuracy < bestFix.accuracy) bestFix = { lat: c.latitude, lng: c.longitude, accuracy: c.accuracy };
  checkAndLog();
}

const logTimer = setInterval(() => {
  if (visitLogged) { clearInterval(logTimer); return; }
  const noFixTooLong = firstFixTime === null && Date.now() - logStart >= NO_FIX_MAX_WAIT_MS;
  const accurateTooLate = firstFixTime !== null && Date.now() - firstFixTime >= MAX_WAIT_MS;
  if (noFixTooLong || accurateTooLate) {
    clearInterval(logTimer);
    logVisitOnce(NaN, NaN);
    return;
  }
  checkAndLog();
}, 500);

// ---- Locate me ----------------------------------------------------------------
const locateBtn = document.getElementById('locateBtn');
let lastFixTime = 0;

function updateUserMarker(lat, lng) {
  if (!userMarker) {
    const el = document.createElement('div');
    el.className = 'user-icon';
    el.innerHTML = '<div class="user-dot"></div>';
    userMarker = new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).addTo(map);
  } else {
    userMarker.setLngLat([lng, lat]);
  }
  lastFixTime = Date.now();
}

function onLocationFound(pos, recenter) {
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;
  updateUserMarker(lat, lng);
  considerForLog(pos);
  if (recenter) moveTo(lng, lat, 16, 0);
  locateBtn.classList.remove('active');
}

function onLocationError(err) {
  locateBtn.classList.remove('active');
  console.error(err);
  if (err.__userTriggered) {
    alert('Could not get your location. Please allow location access in your browser/phone settings.');
  }
}

function locateMe(userTriggered) {
  if (!navigator.geolocation) return;
  locateBtn.classList.add('active');
  const options = userTriggered
    ? { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
    : { enableHighAccuracy: false, maximumAge: 60000, timeout: 5000 };
  navigator.geolocation.getCurrentPosition(
    (pos) => onLocationFound(pos, userTriggered || !userSearched),
    (err) => { err.__userTriggered = userTriggered; onLocationError(err); },
    options
  );
}

locateBtn.addEventListener('click', () => {
  if (!navigator.geolocation) { alert('Geolocation is not supported on this device.'); return; }
  if (userMarker) { const ll = userMarker.getLngLat(); moveTo(ll.lng, ll.lat, 16, 0); return; }
  locateMe(true);
});

locateMe(false);

if (navigator.geolocation) {
  navigator.geolocation.watchPosition(
    (pos) => onLocationFound(pos, false),
    (err) => console.error('watchPosition error:', err),
    { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
  );
}

let forcingFix = false;
setInterval(() => {
  if (!navigator.geolocation || forcingFix) return;
  if (lastFixTime && Date.now() - lastFixTime > 5000) {
    forcingFix = true;
    navigator.geolocation.getCurrentPosition(
      (pos) => { onLocationFound(pos, false); forcingFix = false; },
      (err) => { console.error('forced fix error:', err); forcingFix = false; },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 }
    );
  }
}, 1000);

// Zoom gestures (all built into MapLibre, all GPU-smooth):
//  - pinch with two fingers
//  - double-tap: zoom in one level
//  - double-tap, HOLD, then drag: drag down = zoom in, drag up = zoom out
// Exposed for testing / debugging from the console.
window.__fatmap = { map, get points() { return allPoints; } };
</script>
