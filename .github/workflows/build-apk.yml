name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'fat_map_app/**'
      - 'data.csv'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fat_map_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Use the repository's data.csv
        run: |
          mkdir -p assets
          if [ -f ../data.csv ]; then cp ../data.csv assets/data.csv; fi
          if [ ! -f assets/data.csv ]; then
            echo "::error::data.csv not found"; exit 1
          fi

      - name: Generate Android project
        run: |
          flutter create --org com.masiraq --project-name fat_map --platforms android .
          python3 tool/patch_android.py

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: fat-map-apk
          path: fat_map_app/build/app/outputs/flutter-apk/app-release.apk
